services:
  upload-local:
    build: .
    container_name: upload-local
    ports:
      - "3021:3000"
    env_file:
      - .env
    volumes:
      - "/media/devmon/SERVER ZIMA 250/UPLOAD:/UPLOAD"
    environment:
      PORT: "3000"
      PUBLIC_BASE_PATH: "/"
      PUBLIC_URL: "http://192.168.1.98:3021/"
      TARGET_MODE: "local"
      UPLOAD_DIR: "/UPLOAD"
      MAX_FILE_SIZE_MB: "5120"
    restart: unless-stopped



