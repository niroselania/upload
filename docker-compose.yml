services:
  upload-local:
    build:
      context: https://github.com/niroselania/upload.git#main
      dockerfile: Dockerfile
    container_name: upload-local
    ports:
      - "3021:3000"
    volumes:
      - "/media/HDD-500/UPLOAD EXT:/uploads"
    environment:
      PORT: "3000"
      PUBLIC_BASE_PATH: "/"
      PUBLIC_URL: "http://192.168.1.98:3021/"
      TARGET_MODE: "local"
      UPLOAD_DIR: "/uploads"
      UPLOAD_USER: "niros"
      UPLOAD_PASS: "ardy30fe"
      MAX_FILE_SIZE_MB: "5120"
    restart: unless-stopped



